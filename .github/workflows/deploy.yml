name: Publikacja na Cloudflare

# Wysyła folder public/ do Cloudflare Workers (wrangler.jsonc).
# Wymaga sekretu repo CLOUDFLARE_API_TOKEN (account_id jest w wrangler.jsonc).
# Bazę D1 "plusone" zakłada sam, jeśli jej nie ma, i nakłada migracje z migrations/.
on:
  push:
    branches: [main]
  workflow_run:                 # commity bota z danymi nie odpalają "push", więc łapiemy koniec aktualizacji
    workflows: ['Aktualizacja wydarzeń']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź klucze Cloudflare
        id: keys
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Brak sekretu CLOUDFLARE_API_TOKEN — pomijam publikację."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          ref: main               # zawsze najnowszy main (także po commicie bota)

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Baza danych (D1)
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          find_id() { npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s).find(x=>x.name==='plusone');console.log(d?d.uuid:'')}catch(e){console.log('')}})"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "Zakładam bazę D1 plusone…"
            npx --yes wrangler@4 d1 create plusone --location eeur || true
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then
            # bez bazy publikujemy apkę bez kont (API odpowie "baza niepodłączona"), zamiast blokować całą stronę
            echo "::warning::Brak dostępu do D1 — token potrzebuje uprawnienia Account / D1 / Edit. Publikuję bez kont."
            sed -i '/D1-START/,/D1-END/d' wrangler.jsonc
            exit 0
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          npx --yes wrangler@4 d1 migrations apply plusone --remote

      - name: Publikuj
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
