name: Instagram — podgląd grafiki

# Ręcznie: pochodna JPEG (taka, jaką dostanie Meta) dla jednego wydarzenia.
# Wynik: Actions → przebieg → Artifacts → "instagram-podglad" (plik .jpg i opis rozmiarów).
on:
  workflow_dispatch:
    inputs:
      event:
        description: 'ID wydarzenia z public/data/events.json'
        required: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grafika
        env:
          EVENT_ID: ${{ inputs.event }}
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.33.5
          mkdir -p ig-podglad
          node pipeline/tools/ig-images.mjs --event="$EVENT_ID" --out=ig-podglad | tee ig-podglad/info.json
          # miniatura w logu (do szybkiego podglądu bez pobierania artefaktu)
          F="$(ls ig-podglad/*.jpg | head -1)"
          node -e "import('sharp').then(async ({default:s})=>{const b=await s(process.argv[1]).resize(432).jpeg({quality:70}).toBuffer();console.log('MINIATURA-START');console.log(b.toString('base64').match(/.{1,76}/g).join('\n'));console.log('MINIATURA-KONIEC')})" "$F"
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-podglad
          path: ig-podglad/
          retention-days: 14
