name: Aktualizacja wydarzeń

on:
  schedule:
    - cron: '7 5,15 * * *'   # 2× dziennie: ok. 6:00 i 16:00 czasu polskiego (zimą; latem 7:00 i 17:00)
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pobierz i przetwórz wydarzenia
        run: node pipeline/run.mjs

      - name: Zapisz zmiany
        run: |
          git config user.name "plusone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Aktualizacja wydarzeń $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
