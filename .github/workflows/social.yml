name: Posty na Instagram

# Pon. i czw. rano: wybór wydarzeń o największym potencjale + grafiki (post 1080×1350, story 1080×1920)
# i gotowe opisy. Wynik do pobrania w zakładce Actions → ten przebieg → Artifacts → "instagram".
on:
  schedule:
    - cron: '7 5 * * 1,4'
  workflow_dispatch:
    inputs:
      city:
        description: 'Miasto do planszy "Weekend"'
        default: 'Warszawa'
      count:
        description: 'Ile wydarzeń'
        default: '6'

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Przeglądarka do renderowania
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Grafiki i opisy
        run: node social/generate.mjs --city="${{ inputs.city || 'Warszawa' }}" --count="${{ inputs.count || '6' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: instagram
          path: social/out/
          retention-days: 30
